[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyforge"
version = "0.1.0"
description = "MOCK enterprise API key management tool (NOT FOR PRODUCTION)"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
keyforge = "keyforge.cli:main"

[tool.setuptools]
packages = ["keyforge"]
