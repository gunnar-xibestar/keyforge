[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyforge"
version = "0.3.0"
description = "API key manager with envelope encryption, a local or PKCS#11 KMS, and optional Auth0"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
keyforge = "keyforge.cli:main"

[tool.setuptools]
packages = ["keyforge"]
