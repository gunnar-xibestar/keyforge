name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2

      - name: Install the package, pytest, and coverage
        # python-pkcs11 is what SoftHsmTests uses to open the token.
        # 0.10.1 is the release that installed and passed against SoftHSM.
        run: pip install -e . pytest coverage python-pkcs11==0.10.1

      - name: Run tests
        run: coverage run -m pytest

      - name: Coverage report
        if: always()
        run: coverage report
